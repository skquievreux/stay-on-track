name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pylint

      - name: Analysing the code with pylint
        run: |
          pylint src --disable=C0114,C0115,C0116,R0903,W0702,E0401

      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Compile Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup_script.iss

      - name: Calculate SHA256
        id: sha256
        run: |
          $hash = (Get-FileHash -Path "Output\StayOnTrack_Setup.exe" -Algorithm SHA256).Hash
          echo "INSTALLER_SHA256=$hash" >> $env:GITHUB_OUTPUT
          echo "SHA256: $hash"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Output/StayOnTrack_Setup.exe
          generate_release_notes: true
          body: |
            ## Installation
            
            Download `StayOnTrack_Setup.exe` and run it.
            
            ### Alternative Installation Methods
            
            **Winget:**
            ```powershell
            winget install Quievreux.StayOnTrack
            ```
            
            **Chocolatey:**
            ```powershell
            choco install stayontrack
            ```
            
            ### SHA256 Checksum
            ```
            ${{ steps.sha256.outputs.INSTALLER_SHA256 }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
