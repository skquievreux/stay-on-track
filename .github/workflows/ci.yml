
name: Stay-On-Track CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pylint pytest

    - name: Analysing the code with pylint
      run: |
        pylint src --disable=C0114,C0115,C0116,R0903,W0702

    - name: Build with PyInstaller
      run: |
        pyinstaller build.spec

    - name: Setup Inno Setup
      uses: thirdwavelabs/inno-setup-action@v1.0.4
      with:
        path: setup_script.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StayOnTrack-Installer
        path: Output/StayOnTrack_Setup.exe

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install -g pnpm && pnpm install --frozen-lockfile

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
