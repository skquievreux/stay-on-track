
name: Stay-On-Track CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write  # Required for semantic-release to create tags and releases
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # cache: 'poetry'  # Disabled until poetry.lock is committed

    - name: Install Poetry
      run: |
        pipx install poetry
        poetry --version

    - name: Install dependencies
      run: poetry install

    - name: Analysing the code with pylint
      run: |
        poetry run pylint src --disable=C0114,C0115,C0116,C0303,C0206,R0903,R0914,R1702,W0212,W0611,W0612,W0702,E0401 || true

    - name: Build with PyInstaller
      run: |
        poetry run pyinstaller build.spec

    - name: Install Inno Setup
      run: |
        choco install innosetup -y

    - name: Compile Installer with Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup_script.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StayOnTrack-Installer
        path: Output/StayOnTrack_Setup*.exe

  # Semantic Release Job - DISABLED
  # Requires additional GitHub permissions configuration
  # Can be enabled later by uncommenting this section
  #
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true  # Required for semantic-release to push tags
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: npm install -g pnpm && pnpm install --frozen-lockfile

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      
      - name: Download Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: StayOnTrack-Installer
          path: ./installer
      
      - name: Upload Installer to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep "Number=" version.txt | cut -d'=' -f2)
          gh release upload v${VERSION} ./installer/*.exe --clobber

