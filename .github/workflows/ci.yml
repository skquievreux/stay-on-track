
name: Stay-On-Track CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint pytest
        
    - name: Analysing the code with pylint
      run: |
        # Run pylint on src directory. Errors will fail the build.
        # We allow some convention/refactor messages for now to pass easily
        pylint src --disable=C0114,C0115,C0116,R0903,W0702
