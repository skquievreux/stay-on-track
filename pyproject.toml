[tool.poetry]
name = "stay-on-track"
version = "0.1.0"  # Managed by semantic-release
description = "Simple productivity tracking application with 15-minute reminders"
authors = ["Quievreux"]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.8,<3.13"  # PyInstaller 6.x supports up to Python 3.12

# Core Dependencies
customtkinter = "^5.2.0"
pystray = "^0.19.5"
pillow = "^10.0.0"
schedule = "^1.2.0"

[tool.poetry.group.dev.dependencies]
# Code Quality
black = "^23.0.0"
ruff = "^0.1.0"
isort = "^5.13.0"

# Testing
pytest = "^7.0.0"
pytest-cov = "^4.0.0"

# Type Checking (optional)
mypy = "^1.0.0"

# Linting (for CI/CD)
pylint = "^3.0.0"

[tool.poetry.group.build.dependencies]
# Build Tools
pyinstaller = "^6.0.0"

[tool.poetry.scripts]
stay-on-track = "src.main:main"

# ====================================
# Code Quality Configuration
# ====================================

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # Line too long (black handles this)
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src --cov-report=term-missing"

# ====================================
# Build System
# ====================================

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
